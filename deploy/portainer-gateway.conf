worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  server_tokens off;
  # Do not log query strings: they can contain business or access data.
  log_format ingress '$remote_addr client=$http_x_real_ip "$request_method $uri" $status';
  access_log /dev/stdout ingress;
  client_max_body_size 85m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Docker may replace upstream containers during an update. Resolve their
  # service names again instead of retaining the old container IP forever.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    set $api_upstream backend:3000;
    set $frontend_upstream frontend:3000;
    # Health and API docs remain private, even if guessed through NPM.
    location ~* ^/(?:api/v1/health(?:/.*)?|__health|docs(?:/.*|-json)?)$ { return 404; }
    # Only authenticated LMS uploads may exceed the general request limit.
    # Stream to the API instead of buffering a large lesson on the gateway.
    location ~ "^/api/v1/lms/admin/lessons/[0-9a-fA-F-]{36}/assets$" {
      client_max_body_size 500m;
      proxy_request_buffering off;
      proxy_send_timeout 600s;
      include /etc/nginx/portainer-api.conf;
    }
    location = /api/v1 { include /etc/nginx/portainer-api.conf; }
    location /api/v1/ { include /etc/nginx/portainer-api.conf; }
    location = /socket.io { include /etc/nginx/portainer-api.conf; }
    location /socket.io/ { include /etc/nginx/portainer-api.conf; }
    location / {
      proxy_pass http://$frontend_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $http_x_real_ip;
      proxy_set_header X-Real-IP $http_x_real_ip;
    }
  }
}
