# Include inside http {} only after replacing certificate paths and provisioning
# the private gateway key snippet. Requires ngx_http_auth_request_module.
# No DNS, firewall, certificate or production changes are performed by this template.
server {
    listen 443 ssl;
    server_name meet.sarkisianbrand.ru;
    ssl_certificate /etc/letsencrypt/live/meet.sarkisianbrand.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.sarkisianbrand.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The LiveKit protocol carries a JWT in the query string. No raw URI/error logs.
    access_log off;
    error_log /dev/null crit;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Access-Control-Allow-Origin https://sarkisianbrand.ru always;

    location /rtc {
        # Capture before auth_request changes the request context. Includes initial
        # join, SDK refresh/reconnect and validate requests. Do NOT cache auth results.
        set $crm_media_token $arg_access_token;
        auth_request /_crm_media_auth;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The same query capability is validated by both gate and LiveKit. Strip
        # alternate bearer headers to prevent checking one token and using another.
        proxy_set_header Authorization "";
        proxy_set_header X-Meeting-Gateway-Key "";
        proxy_set_header X-Meeting-Media-Token "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_pass http://127.0.0.1:7880;
    }

    location = /_crm_media_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/v1/meeting-media-gateway/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header X-Meeting-Media-Token $crm_media_token;
        # File owned by root (0600), contains:
        # proxy_set_header X-Meeting-Gateway-Key "<unique random gateway key>";
        include /etc/nginx/snippets/crm-media-gateway-key.conf;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # No public /twirp, RoomService, health/debug, or unrestricted proxy fallback.
    location / { return 404; }
}
